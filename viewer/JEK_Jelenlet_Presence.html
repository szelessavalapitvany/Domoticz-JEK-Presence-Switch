	<script>
	var address = window.location.hostname;
	var port = window.location.port;
	var proto = window.location.protocol + '//';

	if (typeof window.TranslationLoader === 'undefined') {

		class TranslationLoader {
			constructor() {
				this.translations = {};
				this.loadTranslations().then((translations) => {
					this.translations = translations;
					if ($.isEmptyObject(this.translations)) {
						console.log("Hiba történt a fordítások betöltése közben!");
					} else {
						this.translatePage();
					}
				});
			}

			async loadTranslations() {
				
				// Ellenőrzés, hogy a szükséges változók léteznek-e
				if (typeof proto === 'undefined' || typeof address === 'undefined' || typeof port === 'undefined') {
					console.error("Hiányzik a 'proto', 'address' vagy 'port' változó.");
					return {};
				}

				let aktlanguage;

				const settingsUrl = `${proto}${address}:${port.toString()}/json.htm?type=command&param=getsettings`;

				await fetch(settingsUrl)
					.then(response => {
						if (!response.ok) {
							throw new Error('Hálózati hiba történt');
						}
						return response.json();
					})
					.then(data => {
						if (data) {
							aktlanguage = data.Language;
						} else {
							console.error('Nem található nyelvi információ.');
						}
					})
					.catch(error => {
						console.error('Hiba a beállítások lekérése közben:', error);
					});

				console.log (aktlanguage)

				const filePath = `/templates/jek_html_translate_${aktlanguage}.json`;
				try {
					const response = await $.getJSON(filePath);
					return response;
				} catch (error) {
					console.log(`Hiba történt a '${filePath}' fájl betöltése közben: ${error}`);
					return {};
				}
			}

			t(text) {
				return this.translations[text] || text;
			}
			translatePage() {
				$('[data-translate]').each((index, element) => {
					const key = $(element).data('translate');
					const translation = this.t(key);
					$(element).text(translation);
				});
				//console.log("Oldal sikeresen leforditva.");
			}
		}

		window.TranslationLoader = TranslationLoader;
	}

		var script = document.createElement('script');
		script.src = 'templates/jek_viewer.js?' + Date.now();
		document.head.appendChild(script);
		
	</script>

			("0" + this.getHours()).slice(-2) +

					});
					dropZone.addEventListener('dragleave', () => {
						dropZone.classList.remove('dragover');
					});
					dropZone.addEventListener('drop', e => {
						e.preventDefault();
						dropZone.classList.remove('dragover');
						const id = e.dataTransfer.getData('id');
						const label = e.dataTransfer.getData('label');
						const target = e.dataTransfer.getData('target');

						let currentIds = dropZone.dataset[datasetKey] ? dropZone.dataset[datasetKey].split(',') : [];

					`Mode2=${encodeURIComponent(mode2List.join(','))}`,
					`Mode3=${encodeURIComponent(mode3List.join(','))}`,
					`Mode4=${encodeURIComponent(mode4List.join(','))}`,
					`Mode5=${encodeURIComponent(mode5)}`,
					`Mode6=${encodeURIComponent(mode6)}`
				].join('&');

				const url = `${window.location.protocol}//${window.location.hostname}${port}/json.htm?type=command&param=updatehardware&htype=94&extra=JEK&idx=${jek[i].id}&enabled=true&datatimeout=0&name=${jek[i].name}&address=${jek[i].host}&port=${jek[i].port}&username=${jek[i].uname}&password=${jek[i].pass}&${query}`;

				try {
					const xhr = new XMLHttpRequest();
					xhr.open("GET", url, true);
					xhr.onload = function () {
						if (xhr.status === 200) {
							//alert(`Mentés sikeres: ${jek[i].name}`);
							location.reload();
						} else {
							alert(`Hiba történt (${xhr.status}): ${jek[i].name}`);
						}
					};
					xhr.onerror = function () {
						hideSaveStatus();
						alert(`Hálózati hiba: ${jek[i].name}`);
					};
					xhr.send();
				} catch (e) {
					hideSaveStatus();
					console.error("Mentési kivétel:", e);
					alert(`Hiba a mentés közben (${jek[i].name})`);
				}
			};
		})(i));



	}
}
});
</script>
